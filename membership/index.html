<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Playground — Betalingsstatus</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e8eaf0; min-height: 100vh; }
.header { background: #13151f; border-bottom: 1px solid #232636; padding: 18px 32px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.header h1 { font-size: 20px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
.header .sub { font-size: 12px; color: #6b7280; margin-top: 3px; }
.badge-ok   { display: inline-flex; align-items: center; gap: 6px; background: #0d1a0d; border: 1px solid #1e3a1e; border-radius: 20px; padding: 5px 14px; font-size: 12px; color: #86efac; }
.badge-warn { display: inline-flex; align-items: center; gap: 6px; background: #1c0f0f; border: 1px solid #7f1d1d; border-radius: 20px; padding: 5px 14px; font-size: 12px; color: #fca5a5; }
.content { padding: 24px 32px; max-width: 900px; margin: 0 auto; }
.section-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; padding: 4px 10px; border-radius: 4px; display: inline-block; margin-bottom: 12px; }
.label-ok   { background: #1a2010; color: #86efac; }
.label-warn { background: #1c0d0d; color: #fca5a5; }
.kpi-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
.kpi { background: #13151f; border: 1px solid #232636; border-radius: 12px; padding: 18px 20px; }
.kpi-label { font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 8px; }
.kpi-value { font-size: 32px; font-weight: 700; color: #fff; letter-spacing: -0.5px; line-height: 1.1; }
.kpi-value.ok   { color: #4ade80; }
.kpi-value.warn { color: #f87171; }
.ok-panel { background: #0d140d; border: 1px solid #1e3a1e; border-radius: 12px; padding: 32px 24px; text-align: center; margin-bottom: 20px; }
.ok-icon  { font-size: 48px; margin-bottom: 12px; }
.ok-title { font-size: 20px; font-weight: 700; color: #4ade80; margin-bottom: 6px; }
.ok-sub   { font-size: 13px; color: #4a7a4a; }
.warn-panel { background: #130d0d; border: 1px solid #7f1d1d; border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
.warn-header { background: #1c0f0f; padding: 14px 20px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #7f1d1d; }
.warn-header-title { font-size: 14px; font-weight: 700; color: #fca5a5; }
.warn-header-sub { font-size: 11px; color: #7f1d1d; margin-top: 2px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th { padding: 10px 16px; color: #6b7280; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.6px; border-bottom: 1px solid #2a1010; font-weight: 500; text-align: left; }
tbody td { padding: 12px 16px; border-bottom: 1px solid #1a0d0d; color: #e8eaf0; vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: #1a0f0f; }
.member-navn { font-weight: 600; color: #fff; }
.member-type { font-size: 11px; color: #9ca3af; margin-top: 2px; }
.status-badge { display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; }
.status-ikke-sendt { background: #1c1507; color: #fbbf24; border: 1px solid #854d0e; }
.status-feilet     { background: #1c0f0f; color: #f87171; border: 1px solid #7f1d1d; }
.status-ubetalt    { background: #1c0f0f; color: #fca5a5; border: 1px solid #7f1d1d; }
.status-annet      { background: #1e2130; color: #8890a8; border: 1px solid #2e3250; }
.debitert-dato { font-size: 12px; color: #9ca3af; }
.debitert-forfalt { color: #f87171; font-weight: 600; }
@media (max-width: 700px) { .kpi-row { grid-template-columns: 1fr 1fr; } .content { padding: 16px; } }
</style>
</head>
<body>
<div class="header">
  <div>
    <h1 id="h-tittel">Playground — Betalingsstatus</h1>
    <div class="sub" id="h-sub"></div>
  </div>
  <div id="h-badge"></div>
</div>
<div class="content">
  <div class="kpi-row" id="kpi-row"></div>
  <div id="main-content"></div>
</div>
<script>
const D = /* DATA_START */{
  "dato": "16. april 2026",
  "generert": "17. april 2026",
  "total_besok": 141,
  "ab_sjekket": 87,
  "ubetalt": [
    {
      "navn": "Fahad Ibrahim",
      "ab_type": "Ingen abonnement",
      "debitert_tom": "",
      "status": "Ikke sendt"
    },
    {
      "navn": "Jan Henrik Høiland",
      "ab_type": "Medlemskap (Avsluttet)",
      "debitert_tom": "14.04.2026",
      "status": "Ikke sendt"
    }
  ]
}/* DATA_END */;

document.title = `Playground — Betalingsstatus ${D.dato}`;
document.getElementById('h-tittel').textContent = `Playground — Betalingsstatus ${D.dato}`;
document.getElementById('h-sub').textContent = `Gaarsdagens innganger sjekket - Generert ${D.generert}`;

const harUbetalt = D.ubetalt && D.ubetalt.length > 0;
document.getElementById('h-badge').innerHTML = harUbetalt
  ? `<div class="badge-warn">⚠️ ${D.ubetalt.length} ubetalt</div>`
  : `<div class="badge-ok">✅ Alle har betalt</div>`;

document.getElementById('kpi-row').innerHTML = [
  { label: 'Besok i gar', val: D.total_besok, cls: '' },
  { label: 'Abonnenter sjekket', val: D.ab_sjekket, cls: '' },
  { label: 'Ikke betalt', val: D.ubetalt.length, cls: harUbetalt ? 'warn' : 'ok' }
].map(k => `<div class="kpi"><div class="kpi-label">${k.label}</div><div class="kpi-value ${k.cls}">${k.val}</div></div>`).join('');

const main = document.getElementById('main-content');
if (!harUbetalt) {
  main.innerHTML = `
    <div class="section-label label-ok">✅ Betalingsstatus</div>
    <div class="ok-panel">
      <div class="ok-icon">✅</div>
      <div class="ok-title">Alle har betalt</div>
      <div class="ok-sub">Alle ${D.ab_sjekket} abonnenter som besokte ${D.dato} har gyldig betaling.</div>
    </div>`;
} else {
  const statusClass = s => {
    if (!s) return 'status-annet';
    const sl = s.toLowerCase();
    if (sl.includes('ikke sendt')) return 'status-ikke-sendt';
    if (sl.includes('feil')) return 'status-feilet';
    if (sl.includes('ubetalt')) return 'status-ubetalt';
    return 'status-annet';
  };
  const today = new Date(); today.setHours(0,0,0,0);
  const parseDate = s => { if(!s)return null; const p=s.split('.'); return p.length===3?new Date(p[2],p[1]-1,p[0]):null; };
  const rows = D.ubetalt.map(m => {
    const d = parseDate(m.debitert_tom);
    const forfalt = d && d < today;
    return `<tr>
      <td><div class="member-navn">${m.navn}</div><div class="member-type">${m.ab_type||'\u2014'}</div></td>
      <td><span class="debitert-dato ${forfalt?'debitert-forfalt':''}">${m.debitert_tom||'\u2014'}</span></td>
      <td><span class="status-badge ${statusClass(m.status)}">${m.status||'Ukjent'}</span></td>
    </tr>`;
  }).join('');
  main.innerHTML = `
    <div class="section-label label-warn">⚠️ Utestaaende betalinger</div>
    <div class="warn-panel">
      <div class="warn-header">
        <div>
          <div class="warn-header-title">⚠️ ${D.ubetalt.length} abonnent${D.ubetalt.length>1?'er':''} med utestaaende betaling</div>
          <div class="warn-header-sub">Besokte Playground ${D.dato} uten gyldig betaling</div>
        </div>
      </div>
      <table>
        <thead><tr><th>Navn</th><th>Debitert t.o.m.</th><th>Status</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}
</script>
</body>
</html>
